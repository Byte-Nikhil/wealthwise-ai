services:
  # -------------------------------------------------------------
  # Backend Web Service (FastAPI + Python Uvicorn) - FREE Plan
  # -------------------------------------------------------------
  - type: web
    name: wealthwise-backend
    env: python
    plan: free
    region: singapore
    buildCommand: "pip install -r requirements.txt && python datasets/sample_data_generator.py && python train_models.py"
    startCommand: "python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: GEMINI_API_KEY
        sync: false

  # -------------------------------------------------------------
  # Frontend Static Site (React + Vite) - Always FREE on Render
  # -------------------------------------------------------------
  - type: web
    name: wealthwise-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: wealthwise-backend
          property: host
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
