services:
  # -------------------------------------------------------------
  # Backend Web Service (FastAPI + Python Uvicorn)
  # -------------------------------------------------------------
  - type: web
    name: wealthwise-backend
    env: python
    region: singapore
    buildCommand: "pip install -r requirements.txt && python datasets/sample_data_generator.py && python train_models.py"
    startCommand: "python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"

  # -------------------------------------------------------------
  # Frontend Static Site (React + Vite)
  # -------------------------------------------------------------
  - type: web
    name: wealthwise-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
